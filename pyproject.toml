[project]
name = "controle-pieces"
version = "0.1.0"
description = "Harnais d'evaluation du grounding factuel d'un acte juridique sur les pieces qu'il cite"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/controle_pieces"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest ajoute lui-meme src/ et tests/ au chemin d'import : la suite tourne
# apres un simple `pip install pytest`, sans installation prealable du paquet.
# Un relecteur peut donc lancer les tests en une commande.
pythonpath = ["src", "tests"]
